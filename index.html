<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pendalaman TKA Biologi</title>
<style>
:root{--bg:#f3f0ff;--card:#fff;--tx:#1f2340;--mu:#5b6082;--pr:#6d28d9;--pr2:#0d9488;--bd:#e2defa;--ok:#16a34a;--dg:#f59e0b;--no:#cbd5e1;--bad:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14122b;--card:#201d3f;--tx:#eeeafc;--mu:#a9a6cc;--bd:#38336a;--no:#475069}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);line-height:1.5}
.hero{background:linear-gradient(135deg,#6d28d9,#0d9488);color:#fff;text-align:center;padding:28px 16px}
.hero h1{margin:0;font-size:clamp(22px,5vw,34px)}.hero p{margin:6px 0 0;opacity:.9}
.wrap{max-width:900px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 2px 10px #6d28d91a}
label{display:block;font-weight:600;font-size:14px;margin:10px 0 4px}
input{width:100%;padding:11px;border:1.5px solid var(--bd);border-radius:10px;font-size:15px;background:var(--bg);color:var(--tx)}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 16px;font-weight:600}
.btn{background:var(--pr);color:#fff}.btn2{background:var(--dg);color:#222}.btn3{background:var(--bg);color:var(--tx);border:1.5px solid var(--bd)}
.to{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.to button{padding:16px;text-align:left;border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:14px}
.to button.on{border-color:var(--pr);background:linear-gradient(135deg,#6d28d91f,#0d948822)}
.to button[disabled]{opacity:.5;cursor:not-allowed}
.to small{display:block;color:var(--mu);font-weight:400}
.bar{position:sticky;top:0;z-index:5;background:linear-gradient(90deg,#6d28d9,#0d9488);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.timer{font-size:20px;font-weight:800;background:#0003;padding:4px 12px;border-radius:20px;font-variant-numeric:tabular-nums}
.badge{display:inline-block;background:#ede9fe;color:#5b21b6;font-size:12px;font-weight:700;padding:2px 10px;border-radius:20px;margin-bottom:8px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border:1.5px solid var(--bd);border-radius:12px;margin:8px 0;cursor:pointer}
.opt.sel{border-color:var(--pr);background:#6d28d91a}
.opt.ok{border-color:var(--ok);background:#16a34a22}.opt.bad{border-color:var(--bad);background:#dc262622}
table{width:100%;border-collapse:collapse}td,th{border:1px solid var(--bd);padding:8px;text-align:left;font-size:14px}th{background:#6d28d91a}
td.c{text-align:center;width:90px}
.nav{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-top:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:8px}
.grid button{padding:9px 0;background:var(--no);color:#222;border-radius:8px}
.grid .a{background:var(--ok);color:#fff}.grid .d{background:var(--dg);color:#222}.grid .cur{outline:3px solid var(--pr)}
.lg{font-size:13px;display:flex;gap:14px;flex-wrap:wrap;margin-top:10px}.lg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:middle}
.cert{border:6px double var(--pr);border-radius:12px;padding:22px;text-align:center;background:var(--card)}
.cert h2{color:var(--pr);margin:0}.score{font-size:64px;font-weight:800;color:var(--pr2);line-height:1}
.pb{height:16px;background:var(--bg);border-radius:8px;overflow:hidden}.pb div{height:100%;background:linear-gradient(90deg,#6d28d9,#0d9488)}
.exp{background:#0d948822;border-left:4px solid var(--pr2);padding:8px 12px;border-radius:6px;margin-top:8px;font-size:14px}
footer{text-align:center;color:var(--mu);padding:20px 10px 30px;font-size:14px}
.hide{display:none}
@media print{.bar,.noprint,footer,.hero{display:none!important}body{background:#fff}}
</style></head><body>
<div id="app"></div>
<footer>Dikembangkan oleh <b>Bilkis Nur Izzaty, S.Pd.</b> — SMAN 2 Kalianda</footer>
<script>
const P=["Perdagangan cula yang mengancam keberlangsungan spesies Badak Jawa.","Deforestasi dan konversi lahan yang mengurangi ruang jelajah Badak Jawa."];
// t: s=pilihan ganda, m=ganda kompleks (pilih semua benar), k=kategori (benar/salah). a: kunci
const Q=[
{t:'m',q:"Badak Jawa (<i>Rhinoceros sondaicus</i>) berstatus kritis dan hanya ada di TN Ujung Kulon. Populasinya turun akibat pembangunan infrastruktur yang mengganggu habitat, keragaman genetik rendah (risiko penyakit tinggi), dan perburuan yang mengubah perilaku sehingga menghambat reproduksi. Pernyataan mana yang berkaitan dengan penurunan populasi dan faktor penyebabnya?",o:[P[0],P[1],"Perubahan pola migrasi yang menyebabkan distribusi populasi lebih tersebar dan sulit dilacak.","Gangguan ekosistem akibat masuknya spesies lain ke Ujung Kulon sehingga meningkatkan kompetisi.","Minimnya variasi genetik membuat badak sulit beradaptasi dengan lingkungan sekitar."],a:[0,1,4],e:"Faktor yang disebut pada informasi: perburuan (cula), hilangnya habitat akibat pembangunan/deforestasi, dan variasi genetik rendah. Migrasi dan spesies asing tidak disebutkan."},
{t:'s',q:"Ikan awetan yang terkontaminasi <i>Clostridium botulinum</i> menimbulkan gejala gangguan penglihatan, lemah otot, sulit menelan, mual, muntah, dan sakit perut. Mekanisme utama peran bakteri ini dalam keracunan adalah ....",o:["menguraikan protein dan lemak ikan menjadi senyawa berbahaya penyebab mual dan kram","menghasilkan senyawa (toksin) yang menghambat sinyal saraf dan kontraksi otot sehingga penglihatan terganggu dan otot melemah","menyerap komponen ikan ke dinding sel bakteri sehingga menyebabkan gangguan pencernaan dan saraf optik","mengubah gula dan asam amino menjadi senyawa alkohol yang memengaruhi koordinasi","menghasilkan gas pada kondisi anaerob yang meningkatkan tekanan di dalam kemasan"],a:1,e:"<i>C. botulinum</i> menghasilkan neurotoksin botulinum yang menghambat pelepasan asetilkolin pada sambungan saraf-otot, sehingga terjadi kelemahan/kelumpuhan otot dan gangguan penglihatan."},
{t:'s',q:"Lintah hidup di daerah lembap seperti hutan hujan tropis, sangat bergantung pada makhluk hidup lain, dan menempel pada tubuh rusa, kerbau liar, bahkan manusia. Dalam interaksinya, lintah akan ....",o:["berkompetisi dengan inang untuk mendapatkan makanan","memanfaatkan tubuh inangnya sebagai sumber nutrisi","melekatkan diri pada makhluk hidup lain untuk membersihkan darahnya","menempel pada inang untuk mendapatkan perlindungan dari predator","hidup bebas berdampingan dengan makhluk hidup lain di hutan"],a:1,e:"Lintah menghisap darah inang: satu pihak diuntungkan (lintah) dan pihak lain dirugikan, yaitu interaksi parasitisme."},
{t:'s',q:"Skema respirasi seluler: Glukosa → 2 Asam Piruvat (tahap A) → 2 Asetil KoA → siklus (B) → C. Proses yang terjadi pada tahap berlabel A adalah ....",o:["Gugus gula bereaksi dengan oksaloasetat kemudian masuk ke siklus Krebs.","Pengubahan glukosa menjadi asam piruvat dengan penambahan gugus oksigen.","Pelepasan elektron dari NADH dan FADH₂ untuk menghasilkan ATP.","Oksidasi suksinat menjadi fumarat disertai produksi FADH₂.","Produksi ATP melalui penambahan gugus fosfat ke molekul gula."],a:4,e:"Tahap A adalah glikolisis (di sitosol): glukosa difosforilasi lalu dipecah menjadi 2 piruvat, dengan ATP dibentuk lewat fosforilasi tingkat substrat. Oksidasi suksinat terjadi di siklus Krebs (B), dan pelepasan elektron NADH/FADH₂ di rantai transpor elektron."},
{t:'s',q:"Putih telur + protease dimasukkan ke 3 tabung dan diinkubasi pada 37°C selama 30 menit. Tabung A (tanpa tambahan): agak keruh; B (+HCl): bening; C (+NaOH): keruh. Semakin bening larutan, semakin optimal kerja protease. Faktor utama yang memengaruhi kerja enzim protease adalah ....",o:["konsentrasi enzim protease","pH lingkungan tempat enzim bekerja","jenis substrat yang digunakan","suhu larutan selama percobaan","waktu inkubasi enzim dengan substrat"],a:1,e:"Suhu, waktu, substrat, dan konsentrasi enzim sama di semua tabung. Yang berbeda hanya penambahan HCl (asam) dan NaOH (basa), jadi variabel yang memengaruhi adalah pH. Protease lambung bekerja optimal pada pH asam."},
{t:'s',q:"Daun kembang sepatu yang masih menempel di batang ditutup sebagian dengan aluminium foil, disinari matahari 6 jam, lalu direbus, direndam alkohol panas, dan ditetesi lugol. Bagian terbuka menjadi biru kehitaman (amilum positif), bagian tertutup tetap pucat. Faktor yang memengaruhi fotosintesis pada percobaan ini adalah ....",o:["intensitas cahaya pada permukaan daun","konsentrasi karbon dioksida di udara","lebar dan tipisnya permukaan daun","ketersediaan klorofil pada daun","suhu optimal untuk kerja enzim fotosintesis"],a:0,e:"Foil menghalangi cahaya pada sebagian daun, sedangkan faktor lain (klorofil, CO₂, suhu) sama. Hanya bagian yang terkena cahaya membentuk amilum, jadi cahaya adalah faktor yang diuji."},
{t:'s',q:"Pengemudi truk 45 tahun mengalami kecelakaan setelah mengantuk dan sempat memejamkan mata beberapa detik. Ia sering terbangun malam hari dengan napas terengah dan mendengkur keras. Ia didiagnosis <i>obstructive sleep apnea</i> (OSA) dan EKG menunjukkan detak jantung tidak teratur. Hubungan gejala dengan komplikasi adalah ....",o:["gangguan napas saat tidur menyebabkan kurangnya oksigen sehingga meningkatkan risiko detak jantung tidak teratur","dengkur keras mengganggu kualitas tidur sehingga mencegah penyumbatan saluran napas atas","<i>microsleep</i> terjadi karena saluran napas tetap terbuka sepanjang malam","kekurangan oksigen saat tidur membuat pasien lebih jarang mengantuk siang hari","aritmia muncul akibat penurunan kadar CO₂ yang membuat otot jantung lebih stabil"],a:0,e:"Saluran napas atas yang tersumbat berulang menyebabkan hipoksia dan tidur terfragmentasi: menimbulkan kantuk berlebihan (microsleep) dan memicu aritmia karena jantung kekurangan oksigen."},
{t:'s',q:"Gambar komponen darah: A (sel berbentuk cakram, merah), B (sel dengan inti, beragam bentuk), C (kepingan kecil ungu). Pernyataan yang menunjukkan persamaan komponen B (leukosit) dan C (trombosit) adalah ....",o:["memiliki inti sel dan berperan dalam pertahanan tubuh terhadap patogen","tidak berinti dan berperan dalam pengangkutan oksigen","tidak memiliki inti sel dan berfungsi membawa hormon","berbentuk tidak beraturan dan diproduksi di sumsum tulang","bentuk bulat pipih dan berfungsi mengangkut karbon dioksida"],a:3,e:"A = eritrosit, B = leukosit, C = trombosit. Leukosit dan trombosit sama-sama berbentuk tidak beraturan dan dibentuk di sumsum tulang merah. Leukosit berinti, trombosit tidak."},
{t:'k',q:"Jari seorang murid tergores cutter hingga berdarah. Jika produksi trombokinase berkurang signifikan, tentukan Benar/Salah pernyataan berikut tentang pembekuan darah!",o:["Darah terus mengalir karena vitamin K tidak dapat diubah menjadi benang fibrin.","Luka lambat menutup karena trombokinase tidak dapat mengaktifkan protrombin menjadi trombin.","Mempercepat pembekuan darah karena mengurangi aktivitas fibrinogen dalam mengalirkan darah."],a:[false,true,false],L:["Benar","Salah"],e:"Alur: trombokinase (+Ca²⁺) mengubah protrombin → trombin; trombin mengubah fibrinogen → fibrin. Jika trombokinase kurang, trombin sedikit sehingga pembekuan lambat (bukan lebih cepat). Vitamin K berperan membentuk protrombin, bukan diubah menjadi fibrin."},
{t:'k',q:"Pria 35 tahun sakit kepala, kaku tengkuk, nyeri dada, sesak napas. Hasil lab: tekanan darah 190/120 (normal 120/80), denyut jantung 98, LDL 195 (&lt;100 mg/dL), HDL 65. Tentukan Sesuai/Tidak Sesuai aktivitas berikut yang memengaruhi kesehatannya!",o:["Sering mengonsumsi makanan tinggi lemak jenuh dan cepat saji sehingga kadar LDL meningkat.","Terkadang mengikuti kelas yoga dan meditasi beberapa kali sebulan untuk kesehatan jantung, sehingga LDL tetap tinggi.","Sering mengalami stres kerja dan kurang tidur kronis, yang dapat memengaruhi tekanan darah dan denyut jantung."],a:[true,true,true],L:["Sesuai","Tidak Sesuai"],e:"Lemak jenuh menaikkan LDL; olahraga/relaksasi yang jarang tidak cukup menurunkan LDL; stres dan kurang tidur kronis meningkatkan hormon stres sehingga tekanan darah dan denyut jantung naik. Ketiganya sesuai dengan data hasil pemeriksaan."},
{t:'s',q:"Pak Junaidi (40 tahun), kuli bangunan, bekerja tanpa henti di cuaca panas terik dan kurang minum. Ia pingsan, suhu tubuh 40,5°C, kulit memerah, tidak berkeringat, denyut nadi cepat (<i>heat stroke</i>). Penyebab utama kegagalan tubuh mempertahankan suhu normal adalah ....",o:["Dehidrasi membuat proses berkeringat terhenti, sehingga panas tidak dapat dikeluarkan secara efektif.","Pelebaran pembuluh darah di kulit menyebabkan tubuh menyimpan panas berlebihan di dalam darah.","Tingginya suhu tubuh menyebabkan otot bekerja lebih cepat, sehingga suhu tidak bisa turun.","Kurangnya cairan menyebabkan meningkatnya aliran darah yang justru menaikkan suhu tubuh.","Kondisi lingkungan panas menyebabkan tubuh berhenti mengatur suhu untuk menghemat energi."],a:0,e:"Kekurangan cairan membuat volume darah turun dan kelenjar keringat berhenti bekerja. Penguapan keringat adalah cara utama membuang panas, sehingga suhu tubuh melonjak (kulit merah, tidak berkeringat)."},
{t:'k',q:"Pak Gito (69 th) tersesat, lupa nama dan nama keluarga, mengulang pertanyaan yang sama, dan didiagnosis Alzheimer lewat MRI. Tentukan BENAR/SALAH pernyataan berikut!",o:["Kerusakan pada area lobus parietal dan hippocampus menyebabkan gangguan memori spasial yang berkaitan dengan lokasi dan arah.","Penumpukan protein abnormal pada area hipotalamus mengakibatkan penurunan ingatan baik nama maupun lokasi.","Plak yang terbentuk pada sel saraf menghalangi komunikasi antar sel dan mengakibatkan penurunan fungsi kognitif seperti memori dan bahasa."],a:[true,false,true],L:["Benar","Salah"],e:"Pada Alzheimer, plak amiloid dan kusut tau (protein abnormal) menumpuk di otak, terutama hippocampus dan korteks (parietal/temporal), mengganggu komunikasi antar neuron. Hipotalamus bukan pusat utama memori."},
{t:'s',q:"Alika (12 th) sering buang air kecil, haus, mudah lapar, berat badan turun, gula darah puasa 300 mg/dL, dan antibodi anti-GAD positif (autoimun): diabetes melitus tipe 1. Mekanisme autoimun yang menyebabkan hiperglikemia adalah ....",o:["Limfosit B menyerang sel alfa pankreas penghasil glukagon.","Kompleks antigen-antibodi menghambat kerja insulin dan glukagon.","Infeksi bakteri pada pankreas menghancurkan reseptor insulin dan glukagon.","Sel T sitotoksik merusak sel beta pankreas yang menghasilkan insulin.","Antibodi menghambat kerja insulin dalam mengubah glukosa menjadi glikogen."],a:3,e:"Pada DM tipe 1, sistem imun (sel T sitotoksik) menghancurkan sel beta pulau Langerhans sehingga insulin tidak diproduksi dan glukosa tidak masuk ke sel, akibatnya kadar gula darah tinggi."},
{t:'s',q:"Menjelang ujian Vito merasakan jantung berdebar kencang, keringat dingin, tangan gemetar, sulit menelan, sering buang air kecil, napas tersengal, tekanan darah 140/90. Ini respons “lawan atau lari” dari sistem saraf simpatis dengan hormon adrenalin. Mekanisme kerja adrenalin yang paling tepat adalah ....",o:["Otot polos pembuluh darah menyempit sehingga aliran darah ke organ tertentu meningkat dan tekanan darah bertambah cepat.","Saluran udara di paru-paru menyempit lalu memicu napas lebih cepat.","Detak jantung lebih kuat sehingga jumlah darah yang keluar dari jantung berkurang.","Kandung kemih menjadi lebih peka dan aliran darah ke ginjal meningkat.","Gerakan otot saluran pencernaan di tenggorokan melambat karena otot polosnya berkontraksi."],a:0,e:"Adrenalin menyempitkan (vasokonstriksi) pembuluh darah ke organ yang kurang penting, mengalihkan darah ke otot dan otak, serta menaikkan tekanan darah. Bronkus justru melebar, dan curah jantung meningkat."},
{t:'m',q:"Dini (25 th) dan suaminya Dono (28 th) menikah satu tahun belum memiliki anak. Siklus haid Dini tidak teratur (2–4 bulan sekali), wajah berjerawat, berat badan naik, dan USG menunjukkan kista ovarium kiri. Dokter mendiagnosis PCOS. Solusi mana saja yang tepat agar Dini dapat hamil?",o:["Mengonsumsi suplemen peningkat hormon prolaktin secara rutin agar siklus haid teratur.","Operasi pengangkatan ovarium karena ovarium yang terkena kista tidak akan berfungsi lagi.","Menerapkan pola makan sehat dan rutin berolahraga agar hormon seimbang.","Mendapatkan suntikan hormon FSH/LH di bawah observasi dokter untuk merangsang ovulasi.","Mengikuti program bayi tabung dengan sperma Dono agar peluang mendapat keturunan lebih besar."],a:[2,3,4],e:"PCOS ditangani dengan gaya hidup sehat (menurunkan berat badan memperbaiki keseimbangan hormon), induksi ovulasi dengan FSH/LH di bawah pengawasan dokter, dan bayi tabung bila perlu. Prolaktin tinggi justru menekan ovulasi, dan ovarium tidak perlu diangkat."},
{t:'s',q:"Bu Mita hamil 6 bulan, sering lemas dan pusing, gerakan janin melemah. Hemoglobin 7 g/dL (normal &gt; 11 g/dL), dan ia tidak suka makan daging serta sayuran hijau. Bagaimana kondisi tersebut memengaruhi janinnya?",o:["Rendahnya hemoglobin menyebabkan darah ibu mengalir cepat melalui plasenta sehingga janin kelebihan berat badan.","Janin kekurangan oksigen yang dibawa hemoglobin sehingga perkembangan otak dan organ kurang optimal.","Hemoglobin rendah menyebabkan darah ibu pekat sehingga janin tidak tumbuh karena kurang asupan nutrisi.","Risiko pendarahan pada ibu ketika persalinan karena hemoglobin membantu pembekuan darah.","Janin rentan infeksi karena hemoglobin berfungsi menyerang bakteri dan virus dalam rahim."],a:1,e:"Hemoglobin mengangkut O₂. Anemia (kurang zat besi) pada ibu membuat O₂ ke janin berkurang melalui plasenta, sehingga pertumbuhan dan perkembangan otak/organ terhambat dan gerakan janin melemah."},
{t:'k',q:"Seorang murid meneteskan lugol pada nasi (biru kehitaman), tahu (tidak berubah), dan pisang (ungu keabuan). Tentukan Benar/Salah: pertanyaan berikut dapat dikembangkan berdasarkan ilustrasi hasil percobaan!",o:["Mengapa nasi menunjukkan warna biru kehitaman setelah ditetesi lugol?","Bagaimana kandungan amilum pada pisang matang memengaruhi hasil uji?","Apakah warna ungu menunjukkan bahwa tahu mengandung protein tinggi?"],a:[true,true,false],L:["Benar","Salah"],e:"Lugol menguji amilum. Nasi (kaya amilum) menjadi biru kehitaman; pisang matang kadar amilumnya lebih rendah (ungu). Tahu tidak berubah, dan lugol tidak menguji protein, jadi pertanyaan ketiga tidak dapat dijawab oleh percobaan ini."},
{t:'m',q:"Praktikum pengaruh aktivitas fisik terhadap pengeluaran zat sisa: Sampel A (urine saat istirahat, sedikit dan oranye pekat); Sampel B (urine setelah lari 20 menit dan minum banyak air, lebih banyak dan kuning muda). Pertanyaan ilmiah mana yang paling tepat dijadikan dasar penyelidikan? (lebih dari satu)",o:["Bagaimana keringat yang dikeluarkan selama olahraga memengaruhi kadar gula darah?","Apakah jumlah cairan yang diminum memengaruhi volume urine setelah berolahraga?","Bagaimana kaitan antara banyaknya keringat dengan jumlah urine yang keluar?","Mengapa urine setelah olahraga tampak lebih pekat dibanding saat istirahat?","Apakah peningkatan detak jantung saat olahraga memengaruhi warna urine yang dihasilkan?"],a:[1,2],e:"Pertanyaan harus berkaitan dengan data yang diamati (volume dan warna urine, olahraga, minum, keringat). Pilihan 'gula darah' dan 'detak jantung' tidak diukur. Pilihan 4 salah karena urine setelah olahraga justru tampak lebih encer (kuning muda)."},
{t:'s',q:"Murid menyelidiki pengaruh suhu lingkungan terhadap pertumbuhan gulma di taman sekolah selama dua minggu, mencatat data di beberapa lokasi dengan paparan cahaya bervariasi. Langkah pertama dalam pengumpulan data adalah ....",o:["mengukur tinggi tanaman liar setiap hari di area yang paling banyak terkena sinar matahari","menentukan lokasi pengamatan yang konsisten dan mencatat suhu di tiap lokasi secara berkala","membersihkan area dari gulma lain sebelum memulai pengamatan","menyimpulkan bahwa cahaya matahari adalah faktor utama pertumbuhan","memindahkan beberapa tanaman liar ke pot agar bisa diamati di lokasi lebih terkontrol"],a:1,e:"Penyelidikan observasi dimulai dengan menetapkan lokasi pengamatan yang tetap dan mencatat variabel bebas (suhu) secara berkala. Menyimpulkan dilakukan setelah data terkumpul."},
{t:'s',q:"Percobaan daya hambat ekstrak bawang putih (cakram kertas) terhadap bakteri, 3 ulangan, zona bening (mm): Kontrol negatif 0/0/0; A 25%: 1,3/1,5/3,2; B 50%: 2,1/5,5/2,6; C 75%: 3,2/3,8/3,5; D 100%: 7,5/1,5/7,7; Amoxicillin 25/24/26. Hipotesis: makin tinggi konsentrasi, makin lebar zona bening. Mengapa data kurang mendukung hipotesis?",o:["Ulangan yang dilakukan terlalu banyak.","Konsentrasi ekstrak bawang putih kurang bervariasi.","Terdapat data yang tidak konsisten pada perlakuan.","Rentang konsentrasi ekstrak terlalu besar.","Data kontrol positif dan negatif terlalu ekstrem."],a:2,e:"Ada ulangan yang menyimpang jauh dari dua ulangan lainnya (A3 = 3,2; B2 = 5,5; D2 = 1,5), sehingga data tidak konsisten dan pola konsentrasi–zona bening menjadi tidak jelas."},
{t:'s',q:"Hipotesis: “Tanaman kacang hijau tumbuh lebih cepat di media tanah dibanding pasir atau tanah liat.” Tinggi (cm) hari ke-1 s.d. 4: Pasir 0, 1, 1,5, 2; Tanah 0, 1,5, 2,6, 3,7; Tanah liat 0, 0,5, 0,8, mati. Pernyataan yang paling tepat menghubungkan data dengan hipotesis adalah ....",o:["data mendukung karena pertumbuhan tercepat dan tertinggi terjadi pada media tanah dibandingkan dua media lainnya","sebaiknya ditolak karena tanaman tetap tumbuh pada semua media","tidak terbukti karena tanaman pada tanah liat mati sebelum hari keempat","belum dapat disimpulkan karena data lingkungan dan pengulangan tidak tersedia","memerlukan revisi karena perbedaan pertumbuhan antar media tidak terlalu besar"],a:0,e:"Tanah memberi pertambahan tinggi terbesar (3,7 cm) dibanding pasir (2 cm) dan tanah liat (mati), sehingga data mendukung hipotesis. Kematian pada tanah liat justru menguatkan perbedaan antar media."},
{t:'s',q:"CO₂ di suatu wilayah dataran tinggi naik dari 410 ppm menjadi 480 ppm. Wilayah didominasi hutan pinus dan semak endemik. Kepadatan daun pada pohon pinus meningkat, namun komposisi spesies semak berubah karena tidak semua dapat beradaptasi. Dampak yang paling mungkin akibat peningkatan CO₂ terhadap tumbuhan adalah ....",o:["terhambatnya fotosintesis karena CO₂ tinggi mengganggu aktivitas stomata","penurunan jumlah daun akibat peningkatan transpirasi dan suhu ekstrem","meningkatnya produksi biomassa pada jenis tumbuhan tertentu yang toleran terhadap peningkatan CO₂","penurunan kadar klorofil karena CO₂ berlebihan menyebabkan stres fisiologis","tidak terjadi perubahan karena semua jenis tumbuhan memiliki plastisitas yang sama"],a:2,e:"CO₂ adalah bahan baku fotosintesis sehingga biomassa spesies yang toleran (pinus) meningkat, sedangkan spesies lain tersisih. Data menunjukkan respons berbeda antar spesies, bukan tanpa perubahan."},
{t:'s',q:"<i>Lantana camara</i> yang diintroduksi ke Indonesia Timur mendominasi lebih dari 35% padang savana di TN Wasur (2022), menggantikan rumput asli, dan jumlah spesies serangga penyerbuk turun hingga 40% dalam kurang dari lima tahun. Dampak ekologis utama invasi ini terhadap keanekaragaman hayati lokal adalah ....",o:["menggantikan tanaman endemik melalui dominasi ruang dan senyawa alelopatik, sehingga menurunkan keberagaman flora dan fauna","meningkatkan kesuburan tanah dan memicu regenerasi tanaman lokal","tidak berdampak signifikan karena hanya menyebar di lahan kritis","meningkatkan vegetasi hutan sekunder dan menyediakan tempat bersarang baru bagi burung dan reptil kecil","memfasilitasi interaksi simbiotik antara tanaman lokal dan <i>Lantana</i>"],a:0,e:"Spesies invasif menyingkirkan spesies asli lewat kompetisi ruang/cahaya dan alelopati, sehingga flora asli, serangga penyerbuk, dan fauna yang bergantung padanya menurun."},
{t:'s',q:"Pekerja tambang terpapar arsenik anorganik yang menghambat enzim piruvat dehidrogenase (mengubah piruvat menjadi asetil-KoA sebelum siklus Krebs). Dampak langsung gangguan ini terhadap metabolisme sel adalah ....",o:["akumulasi asetil-KoA karena tidak dapat masuk ke siklus Krebs","penurunan NAD⁺ akibat meningkatnya aktivitas rantai transpor elektron","penurunan pembentukan ATP karena terganggunya produksi asetil-KoA","produksi asam laktat meningkat akibat percepatan siklus Krebs","peningkatan fosforilasi oksidatif karena piruvat menumpuk di sitoplasma"],a:2,e:"Tanpa asetil-KoA, siklus Krebs dan rantai transpor elektron kekurangan substrat sehingga ATP menurun (lemah otot, kelelahan). Asetil-KoA tidak menumpuk, yang menumpuk adalah piruvat (diubah menjadi laktat)."},
{t:'s',q:"Seorang murid sulit tidur meski tubuhnya lelah karena sering menggunakan ponsel hingga larut malam. Akibatnya ia mengantuk saat pelajaran pagi dan sulit fokus. Hormon yang produksinya kemungkinan terganggu adalah ....",o:["adrenalin","kortisol","melatonin","oksitosin","tiroksin"],a:2,e:"Melatonin (dari kelenjar pineal) mengatur ritme tidur–bangun dan dihasilkan saat gelap. Cahaya layar ponsel di malam hari menekan produksinya sehingga sulit tidur."},
{t:'s',q:"Pada gambar neuron, bagian penting di tengah badan sel yang ditandai bulat berada di tengah (nukleus) berperan dalam ....",o:["menyusun lapisan pelindung akson untuk mempercepat impuls","mengatur seluruh aktivitas sel saraf termasuk sintesis protein","menghantarkan impuls saraf ke otot dan kelenjar","menerima rangsangan dari lingkungan eksternal","membentuk celah sinapsis sebagai penghubung antar neuron"],a:1,e:"Nukleus berisi DNA dan mengendalikan seluruh aktivitas sel, termasuk sintesis protein. Selubung mielin dibentuk sel Schwann, dendrit menerima rangsang, akson menghantarkan impuls."},
{t:'s',q:"Seorang murid mengalami kulit ruam, gatal, dan sesak napas setiap kali mengonsumsi udang atau cumi-cumi. Kadar imunoglobulin E (IgE) meningkat signifikan. Padahal zat itu seharusnya tidak berbahaya. Kondisi ini merupakan gangguan imun yang melibatkan respons kekebalan tubuh secara ....",o:["spesifik, karena melibatkan antibodi yang mengenali antigen secara khas","nonspesifik, karena melibatkan sel fagosit dan respons inflamasi umum","pasif alami, karena antibodi diperoleh tanpa stimulasi antigen","spesifik alami, karena disebabkan infeksi mikroorganisme patogen","nonspesifik alami, karena terjadi tanpa paparan antigen luar"],a:0,e:"Alergi melibatkan antibodi IgE yang mengenali alergen tertentu (antigen spesifik), jadi termasuk respons kekebalan spesifik (adaptif), bukan akibat infeksi patogen."}
];

<label>Asal Sekolah</label><input id="s" value="${U.sekolah}" placeholder="Nama sekolah"></div>
<div class="card"><h3 style="margin-top:0">Pilih Try Out</h3><div class="to">${TOS.map((t,i)=>`<button ${t.q?"":"disabled"} class="${i==sel?"on":""}" onclick="sel=${i};home2()"><b>${t.n}</b><small>${t.d}</small></button>`).join("")}</div>
<p style="text-align:center"><button class="btn" style="font-size:17px;padding:13px 30px" onclick="start()">Mulai Try Out ▶</button></p></div>${progress()}</div>`}
function home2(){U={nama:$("#n").value,kelas:$("#k").value,no:$("#p").value,sekolah:$("#s").value};home()}
function progress(){const h=hist().filter(x=>!U.nama||x.nama===U.nama);if(!h.length)return"";
return`<div class="card"><h3 style="margin-top:0">Riwayat &amp; Progres</h3>${prog(h)}</div>`}
function prog(h){return h.map(x=>`<div style="margin:8px 0"><div style="display:flex;justify-content:space-between;font-size:14px"><span>${x.to} • ${x.tgl}</span><b>${x.skor}</b></div><div class="pb"><div style="width:${x.skor}%"></div></div></div>`).join("")}
function start(){U={nama:$("#n").value.trim(),kelas:$("#k").value.trim(),no:$("#p").value.trim(),sekolah:$("#s").value.trim()};
if(!U.nama||!U.kelas||!U.sekolah){alert("Lengkapi nama, kelas, dan asal sekolah terlebih dahulu.");return}
const T=TOS[sel];S={T,cur:0,ans:T.q.map(q=>q.t=='m'?[]:q.t=='k'?q.o.map(()=>null):null),dd:T.q.map(()=>false),left:T.min*60};
clearInterval(tick);tick=setInterval(()=>{S.left--;const e=$("#tm");if(e)e.textContent="⏱ "+fmt(S.left);if(S.left<=0)finish()},1000);quiz()}
function done(i){const a=S.ans[i],q=S.T.q[i];return q.t=='s'?a!==null:q.t=='m'?a.length>0:a.every(x=>x!==null)}
function quiz(){const q=S.T.q[S.cur],i=S.cur,a=S.ans[i],n=S.T.q.length;let body="";
if(q.t=='k')body=`<table><tr><th>Pernyataan</th><th class="c">${q.L[0]}</th><th class="c">${q.L[1]}</th></tr>${q.o.map((o,j)=>`<tr><td>${o}</td>${[true,false].map(v=>`<td class="c"><input type="radio" style="width:auto" name="r${j}" ${a[j]===v?"checked":""} onclick="setK(${j},${v})"></td>`).join("")}</tr>`).join("")}</table>`;
else body=q.o.map((o,j)=>{const on=q.t=='s'?a===j:a.includes(j);return`<div class="opt ${on?"sel":""}" onclick="pick(${j})"><span>${q.t=='s'?(on?"🔘":"⚪"):(on?"☑️":"⬜")}</span><span>${o}</span></div>`}).join("");
A.innerHTML=`<div class="bar"><b>${S.T.n} • ${U.nama}</b><span class="timer" id="tm">⏱ ${fmt(S.left)}</span></div><div class="wrap">
<div class="card"><span class="badge">Soal ${i+1} dari ${n} • ${q.t=='s'?"Pilihan Ganda":q.t=='m'?"Pilih semua jawaban yang benar":"Benar/Salah per pernyataan"}</span>
<p>${q.q}</p>${body}
<div class="nav"><button class="btn3" ${i==0?"disabled":""} onclick="go(${i-1})">◀ Sebelumnya</button><button class="btn2" onclick="S.dd[${i}]=!S.dd[${i}];quiz()">${S.dd[i]?"✔ Batal Ragu-ragu":"❓ Ragu-ragu"}</button>${i<n-1?`<button class="btn" onclick="go(${i+1})">Selanjutnya ▶</button>`:`<button class="btn" style="background:var(--ok)" onclick="if(confirm('Selesaikan try out?'))finish()">Selesai ✔</button>`}</div></div>
<div class="card"><b>Navigasi Soal</b><div class="grid" style="margin-top:8px">${S.T.q.map((_,j)=>`<button class="${S.dd[j]?"d":done(j)?"a":""} ${j==i?"cur":""}" onclick="go(${j})">${j+1}</button>`).join("")}</div>
<div class="lg"><span><i style="background:var(--ok)"></i>Sudah dijawab</span><span><i style="background:var(--dg)"></i>Ragu-ragu</span><span><i style="background:var(--no)"></i>Belum dijawab</span></div>
<p style="text-align:right;margin:10px 0 0"><button class="btn" style="background:var(--ok)" onclick="if(confirm('Selesaikan try out sekarang?'))finish()">Akhiri Try Out</button></p></div></div>`;scrollTo(0,0)}
function go(i){S.cur=i;quiz()}
function pick(j){const q=S.T.q[S.cur];if(q.t=='s')S.ans[S.cur]=j;else{const a=S.ans[S.cur],k=a.indexOf(j);k<0?a.push(j):a.splice(k,1)}quiz()}
function setK(j,v){S.ans[S.cur][j]=v;quiz()}
function ok(q,a){if(q.t=='s')return a===q.a;if(q.t=='m')return a.length==q.a.length&&q.a.every(x=>a.includes(x));return q.a.every((x,i)=>a[i]===x)}
function finish(){clearInterval(tick);const Qs=S.T.q,b=Qs.filter((q,i)=>ok(q,S.ans[i])).length,skor=Math.round(b/Qs.length*100);
const r={id:Date.now(),to:S.T.n,nama:U.nama,skor,benar:b,total:Qs.length,tgl:new Date().toLocaleDateString("id-ID",{day:"numeric",month:"long",year:"numeric"})};saveH(r);result(r)}
function pred(s){return s>=85?"Sangat Baik":s>=70?"Baik":s>=55?"Cukup":"Perlu Ditingkatkan"}
function result(r){const Qs=S.T.q,h=hist().filter(x=>x.nama===U.nama);
const byTo=TOS.filter(t=>t.q).map(t=>{const l=h.filter(x=>x.to===t.n);return l.length?`<tr><td>${t.n}</td><td class="c">${l.length}x</td><td class="c">${l[l.length-1].skor}</td><td class="c">${Math.max(...l.map(x=>x.skor))}</td></tr>`:""}).join("");
A.innerHTML=`<div class="hero noprint"><h1>Hasil ${r.to}</h1></div><div class="wrap">
<div class="cert"><h2>🏅 SERTIFIKAT HASIL TRY OUT</h2><p style="margin:2px">Pendalaman TKA Biologi • ${r.to}</p>
<p style="margin:14px 0 2px">Diberikan kepada</p><h1 style="margin:0">${U.nama}</h1>
<p style="margin:4px 0">Kelas ${U.kelas}${U.no?" • No. Peserta "+U.no:""}<br>${U.sekolah}</p>
<div class="score">${r.skor}</div><p style="margin:6px 0"><b>${pred(r.skor)}</b> — ${r.benar} dari ${r.total} soal benar</p>
<table style="margin:12px 0;text-align:left"><tr><th>Rincian Try Out</th><th class="c">Percobaan</th><th class="c">Terakhir</th><th class="c">Tertinggi</th></tr>${byTo}</table>
<div style="text-align:left"><b>Progres Nilai</b>${prog(h)}</div>
<p style="margin:16px 0 0;font-size:13px">${r.tgl} • Pengembang: Bilkis Nur Izzaty, S.Pd. — SMAN 2 Kalianda</p></div>
<p class="noprint" style="text-align:center"><button class="btn" onclick="window.print()">🖨 Cetak / Simpan PDF</button> <button class="btn3" onclick="home()">Kembali ke Beranda</button></p>
<h2 class="noprint">Pembahasan Soal</h2><div class="noprint">${Qs.map((q,i)=>{const a=S.ans[i],g=ok(q,a);let o="";
if(q.t=='k')o=`<table>${q.o.map((x,j)=>`<tr><td>${x}</td><td class="c">Kunci: <b>${q.a[j]?q.L[0]:q.L[1]}</b><br>Anda: ${a[j]===null?"-":a[j]?q.L[0]:q.L[1]}</td></tr>`).join("")}</table>`;
else o=q.o.map((x,j)=>{const key=q.t=='s'?q.a===j:q.a.includes(j),mine=q.t=='s'?a===j:a.includes(j);return`<div class="opt ${key?"ok":mine?"bad":""}"><span>${key?"✅":mine?"❌":"▫️"}</span><span>${x}</span></div>`}).join("");
return`<div class="card"><span class="badge" style="background:${g?"#bbf7d0":"#fecaca"};color:#222">Soal ${i+1} • ${g?"Benar":a&&done(i)?"Salah":"Tidak dijawab / Salah"}</span><p>${q.q}</p>${o}<div class="exp"><b>Pembahasan:</b> ${q.e}</div></div>`}).join("")}</div></div>`;scrollTo(0,0)}
home();
</script></body></html>
